apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docker-poc
spec:
  replicas: 1 # Scale later with: kubectl scale deployment backend --replicas=3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: docker-poc-backend:1.0
          imagePullPolicy: Never # Use the image built on this laptop: never download it
          env:
            - name: GREETING
              value: "Hello from Kubernetes pod!"
            - name: REDIS_HOST
              value: redis # The Service name from 10-redis.yaml
          ports:
            - containerPort: 5000
          readinessProbe: # Only send traffic once port 5000 accepts connections
            tcpSocket:
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
# Spreads requests across every backend pod. nginx reaches it as "backend:5000".
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: docker-poc
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
