# Storage request: "I need 100MB of disk that survives pod restarts" (like the Compose volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: docker-poc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: docker-poc
spec:
  replicas: 1
  strategy:
    type: Recreate # The disk can be attached to one pod at a time
  selector:
    matchLabels:
      app: redis
  template: # The "pod blueprint" Kubernetes copies for each replica
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe: # Same idea as the Compose healthcheck
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
# A service gives pods one stable name and address. Other pods reach Redis at "redis:6379".
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: docker-poc
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
