server {
    listen 80;

    # Example security headers, you can add more as needed
    # Teams edit lines like this to add security headers to your Nginx configuration (to prevent XSS, clickjacking, fix CSP issues, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://backend:5000;";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # For single-page applications, unknown paths should be redirected to index.html so that the react frontend router can handle them
        try_files $uri /index.html;
    }

    # Forward API calls to the backend container, found by its service name in the docker-compose.yml file
    # The browser only ever talks to this server, so there is no CORS problem.
    location /api/ {
        proxy_pass http://backend:5000;
    }
}
