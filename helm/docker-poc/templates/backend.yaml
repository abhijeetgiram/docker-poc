apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }} # Scale later with: kubectl scale deployment backend --replicas=3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }} # Use the image built on this laptop: never download it
          env:
            - name: GREETING
              value: {{ .Values.backend.greeting | quote }}
            - name: REDIS_HOST
              value: redis # The Service name from 10-redis.yaml
          ports:
            - containerPort: 5000
          readinessProbe: # Only send traffic once port 5000 accepts connections
            tcpSocket:
              port: 5000
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
# Spreads requests across every backend pod. nginx reaches it as "backend:5000".
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
