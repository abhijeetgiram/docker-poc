# Example of how a prod environment would differ. Only changed keys are listed;
# everything else comes from values.yaml.
# Preview only: these registry images do not exist.
# helm template docker-poc ./helm/docker-poc -n docker-poc -f ./helm/docker-poc/values-prod.yaml

backend:
  replicas: 3
  image: mycompany.azurecr.io/docker-poc-backend
  tag: "1.4.2"
  pullPolicy: IfNotPresent
  greeting: "Hello from Helm Production!"
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { cpu: "1", memory: 256Mi }

frontend:
  replicas: 2
  image: mycompany.azurecr.io/docker-poc-frontend
  tag: "1.4.2"
  pullPolicy: IfNotPresent

ingress:
  enabled: false