# Example of how a prod environment would differ. Only changed keys are listed;
# everything else comes from values.yaml.
# Published by the GitHub Actions workflow when a matching version tag is pushed.
# helm template docker-poc ./helm/docker-poc -n docker-poc -f ./helm/docker-poc/values-prod.yaml

backend:
  replicas: 3
  image: ghcr.io/abhijeetgiram/docker-poc-backend
  tag: "v0.1.0"
  pullPolicy: IfNotPresent
  env:
    GREETING: "Hello from Helm Production!"
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { cpu: "1", memory: 256Mi }

frontend:
  replicas: 2
  image: ghcr.io/abhijeetgiram/docker-poc-frontend
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: false