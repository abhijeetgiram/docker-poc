name: Build and publish images

on:
  # Pull requests validate builds without publishing images.
  pull_request:
    branches: [master]
  # Branch pushes and version tags (for example, v0.1.0) publish images.
  push:
    branches: [master]
    tags: ["v*"]

# Grant only read access to source and write access to GHCR packages.
permissions:
  contents: read
  packages: write

jobs:
  build:
    # The matrix creates two independent runs: one for backend/, one for frontend/.
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # Run the same build steps once for each app image.
      matrix:
        image: [backend, frontend]
    steps:
      - name: Check out source
        # Download this commit so the runner can access the Dockerfiles and app code.
        uses: actions/checkout@v4

      - name: Set up QEMU
        # Enables emulation so Buildx can build ARM64 images on the AMD64 runner.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        # Provides Docker's extended builder, including multi-platform builds and cache.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # PR builds do not log in because they only build, not push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          # GITHUB_TOKEN is generated for this workflow; packages: write allows pushing.
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        # Compute the image name, tags, and OCI labels for the build step below.
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is owner/repository; append the matrix image name.
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # Emit branch and version tags, an immutable commit-SHA tag, and latest
          # only for the default branch. Each tag points to the same image build.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          # Build from the selected app folder, which contains its Dockerfile.
          context: ./${{ matrix.image }}
          # Publish a multi-platform manifest so Docker selects the right architecture.
          platforms: linux/amd64,linux/arm64
          # Build on PRs; publish on branch and version-tag pushes.
          push: ${{ github.event_name != 'pull_request' }}
          # Reuse the tags and descriptive OCI labels calculated in the metadata step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse build layers across workflow runs to speed up future builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
